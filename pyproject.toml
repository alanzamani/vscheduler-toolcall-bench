[project]
name = "vscheduler-toolcall-bench"
version = "0.1.0"
description = "Which LLM can safely run a scheduler? A tool-calling benchmark on the vScheduler MCP server."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "matplotlib>=3.10",
    "tabulate>=0.9",
    # For the bundled MCP server (src/vscheduler_mcp): the tool surface under
    # test and its allowlist validator.
    "mcp>=1.8.0",
    "pydantic>=2.0",
]

[project.scripts]
toolbench = "toolbench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbench", "src/vscheduler_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

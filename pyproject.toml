[project]
name = "vscheduler-toolcall-bench"
version = "0.1.0"
description = "Which LLM can safely run a scheduler? A tool-calling benchmark on the vScheduler MCP server."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "openai",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "matplotlib>=3.10",
    "tabulate>=0.9",
    # The tool surface under test and its allowlist validator. Pulled from the
    # sibling checkout so the benchmark always scores against the same
    # commands.yaml the MCP server enforces.
    "vscheduler-mcp",
]

[project.scripts]
toolbench = "toolbench.cli:main"

[tool.uv.sources]
vscheduler-mcp = { path = "../vscheduler_mcp_k8s/mcp", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolbench"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Questions for the RAG track, with where the answer lives.
#
# A retrieved chunk counts as relevant when it comes from one of the listed
# sources AND contains the listed phrase (case and whitespace ignored). Gold
# is defined by text, not by chunk id, so the same question scores both
# chunking strategies fairly. `docsrag eval` refuses to run if a phrase is
# missing from its source, so a typo here cannot pass silently.
#
# style: "direct" questions reuse the docs' own words; "paraphrase" questions
# describe the problem in an operator's words, so keyword search has less to
# hold on to. `answer: none` marks questions the docs do not answer: the
# right behaviour is to say so.

questions:
  - id: q01
    style: direct
    q: How do I make the MCP server read-only?
    answer: [{source: mcp-server.md, contains: "MCP_READ_ONLY=true"}]
  - id: q02
    style: paraphrase
    q: I want an assistant to look at the cluster but never be able to change anything. How?
    answer: [{source: mcp-server.md, contains: "MCP_READ_ONLY=true"}]
  - id: q03
    style: direct
    q: Which localhost port does the Kubernetes dev MCP endpoint use?
    answer:
      - {source: mcp-server.md, contains: "http://localhost:8940/mcp"}
      - {source: deployment.md, contains: "| MCP `/mcp` | 8930 | 8931 | 8940 | 8941 |"}
  - id: q04
    style: direct
    q: Why is the node argument required for vkill?
    answer:
      - {source: mcp-server.md, contains: "logs off every user on every node"}
      - {source: cli-reference.md, contains: "logs off EVERY user on EVERY node"}
  - id: q05
    style: paraphrase
    q: What is the worst that can happen if someone ends a session without saying which machine?
    answer:
      - {source: mcp-server.md, contains: "logs off every user on every node"}
      - {source: cli-reference.md, contains: "logs off EVERY user on EVERY node"}
  - id: q06
    style: direct
    q: Why is vcontrol not exposed as an MCP tool?
    answer: [{source: cli-reference.md, contains: "Highest blast radius"}]
  - id: q07
    style: direct
    q: What does the -v flag do for vscheduler commands?
    answer: [{source: mcp-server.md, contains: "gated on `MyPrintCondition.fprint`"}]
  - id: q08
    style: paraphrase
    q: vquota prints nothing at all. Is it broken?
    answer: [{source: mcp-server.md, contains: "`vquota` and `vmanage` print nothing at all without it"}]
  - id: q09
    style: paraphrase
    q: vreport says it succeeded. How can I tell whether the charts were really produced?
    answer: [{source: mcp-server.md, contains: "declares the files a run must have **freshly** written"}]
  - id: q10
    style: direct
    q: How do I connect Claude Desktop to the vscheduler MCP server?
    answer: [{source: mcp-server.md, contains: "Settings → Connectors → Add custom connector"}]
  - id: q11
    style: paraphrase
    q: The desktop app won't accept a plain http address for the server. What's the workaround?
    answer: [{source: mcp-server.md, contains: "mcp-remote"}]

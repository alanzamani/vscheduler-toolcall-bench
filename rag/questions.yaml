    q: How do I add another compute node?
    answer: [{source: deployment.md, contains: "linux_general_range"}]
  - id: q13
    style: direct
    q: Why does vmanage say a node is not a resource in booked?
    answer: [{source: deployment.md, contains: "Its web installer has never been run"}]
  - id: q14
